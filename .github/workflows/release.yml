name: Release

# Push a tag such as v1.2.0 to publish a release. The packages are built twice, on separate runners and
# from different checkout folders, and are published only if both builds are identical byte for byte.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      name: build
      checkout-path: source

  rebuild:
    name: Rebuild
    uses: ./.github/workflows/build.yml
    with:
      name: rebuild
      checkout-path: rebuild/another-folder

  compare:
    name: Compare builds
    needs: [build, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: build
          merge-multiple: true

      - name: Download rebuild
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-*
          path: rebuild
          merge-multiple: true

      - name: Compare
        run: |
          (cd build && sha256sum -- *.zip) > build.sha256
          (cd rebuild && sha256sum -- *.zip) > rebuild.sha256
          cat build.sha256
          if ! diff build.sha256 rebuild.sha256; then
            echo "::error::The two builds differ, so the packages are not reproducible."
            exit 1
          fi

  publish:
    name: Publish
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: packages
          merge-multiple: true

      - name: Write checksums
        working-directory: packages
        run: sha256sum -- *.zip > SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          cat > notes.md <<NOTES
          | File | Contents |
          |---|---|
          | \`mouthtrap-${GITHUB_REF_NAME#v}-win-x64.zip\` | The GUI for Windows 11 (x64). No .NET install needed. |
          | \`mouthtrap-firmware-xiao-wifi-${GITHUB_REF_NAME#v}.zip\` | XIAO ESP32S3 Sense Wi-Fi firmware and \`provision.py\` |
          | \`mouthtrap-firmware-xiao-uvc-${GITHUB_REF_NAME#v}.zip\` | XIAO USB webcam firmware, 320×240 |
          | \`mouthtrap-firmware-xiao-uvc-multimode-${GITHUB_REF_NAME#v}.zip\` | XIAO USB webcam firmware, several modes |

          Models are not included; see the README. Check a download with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\` or against \`SHA256SUMS\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mouthtrap $GITHUB_REF_NAME" --notes-file notes.md --generate-notes "${prerelease[@]}"
