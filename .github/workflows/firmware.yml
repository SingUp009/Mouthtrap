name: Firmware

# Builds every firmware variant, checks that it fits its partition and runs the firmware tests, including the GUI's
# flasher against the firmware in QEMU. Pull requests run it only when they change the firmware, what packs it or the
# flasher.
on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - tools/release/pack.py
      - software/src/Mouthtrap.Firmware/**
      - software/tests/Mouthtrap.Firmware.Tests/**
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - tools/release/pack.py
      - software/src/Mouthtrap.Firmware/**
      - software/tests/Mouthtrap.Firmware.Tests/**
      - .github/workflows/firmware.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # ESP-IDF v5.5.4, pinned by digest. Keep it the same as in build.yml.
    container: espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    strategy:
      fail-fast: false
      matrix:
        variant: [xiao-wifi, xiao-uvc, xiao-uvc-multimode]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and pack
        run: firmware/build-release.sh "0.0.0-ci.${GITHUB_SHA::7}" packages "${{ matrix.variant }}"

      # The component manager rewrites dependencies.lock when the build did not use the locked versions.
      - name: Check locked components
        run: git -c safe.directory='*' diff --exit-code -- firmware

      - name: Check that the app fits its partition
        run: python3 firmware/check-size.py "packages/build/${{ matrix.variant }}"

      # The zip file is what a release ships. The build files next to it hold the flash offsets
      # (flash_args, flasher_args.json) and the ELF and map files for reading crash logs.
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            packages/*.zip
            packages/build/${{ matrix.variant }}/flash_args
            packages/build/${{ matrix.variant }}/flasher_args.json
            packages/build/${{ matrix.variant }}/sdkconfig
            packages/build/${{ matrix.variant }}/*.bin
            packages/build/${{ matrix.variant }}/*.elf
            packages/build/${{ matrix.variant }}/*.map
            packages/build/${{ matrix.variant }}/bootloader/bootloader.bin
            packages/build/${{ matrix.variant }}/partition_table/partition-table.bin

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Settings validation, stream authentication and MJPEG framing, built for the linux target.
      - name: Unit tests
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -C firmware/xiao-wifi/test/host -B "$GITHUB_WORKSPACE/build-host" build
          "$GITHUB_WORKSPACE/build-host/mouthtrap_stream_test.elf"

      # QEMU emulates neither QIO flash nor octal PSRAM, so the start-up tests use their own build settings.
      - name: Build for QEMU
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -C firmware/xiao-wifi -B "$GITHUB_WORKSPACE/build-qemu" -D SDKCONFIG="$GITHUB_WORKSPACE/build-qemu/sdkconfig" \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;test/sdkconfig.qemu" build

      - name: provision.py and start-up tests
        env:
          MOUTHTRAP_QEMU_BUILD: build-qemu
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python -m unittest discover -s firmware/xiao-wifi/test -v

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Mouthtrap.Firmware writes the QEMU build and its Wi-Fi settings through the ROM loader, then boots it.
      - name: Flasher tests
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          # The workspace path inside the container, which github.workspace does not give in a container job.
          export MOUTHTRAP_QEMU_BUILD="$GITHUB_WORKSPACE/build-qemu"
          dotnet restore software/tests/Mouthtrap.Firmware.Tests --locked-mode
          dotnet test --project software/tests/Mouthtrap.Firmware.Tests -c Release --no-restore
